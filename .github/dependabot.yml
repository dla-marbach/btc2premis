# Dependabot: Version und Security Updates, gruppiert je Ecosystem.
# Alerts und Security Updates zusätzlich unter Settings → Advanced Security aktivieren,
# "Grouped security updates" dort aus lassen (Gruppierung steht hier).
# cooldown: neue Versionen erst nach 7 Tagen vorschlagen (Schutz vor
# kompromittierten Releases). Security Updates sind davon nicht betroffen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python-Abhängigkeiten: optionale Extras dev und validate aus pyproject.toml,
  # feste Versionen im Lockfile requirements-dev.txt (pip-compile, aktualisiert Dependabot mit)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
