name: Export crawl configs (reusable)

# Reusable workflow that performs the actual crawl-config export: checks out
# btc2premis, installs it, exports changed crawl configs into
# <output-dir>/websites/ of the *caller* repository, rebuilds the collection
# documents in <output-dir>/collections/, and commits/pushes the result there.
#
# Intended to be called from a thin trigger workflow in another (private)
# repository, e.g.:
#
#   jobs:
#     export:
#       uses: dla-marbach/btc2premis/.github/workflows/export-reusable.yml@vX.Y.Z
#       permissions:
#         contents: write
#       with:
#         ref: vX.Y.Z  # same release tag as in uses:
#         output-dir: data
#       secrets: inherit

on:
  workflow_call:
    inputs:
      output-dir:
        description: "Directory (relative to the caller repo root) with README.md, websites/ and collections/"
        required: false
        type: string
        default: data
      ref:
        description: "Git ref of dla-marbach/btc2premis to check out and install; in production, set it to the same release tag (vX.Y.Z) as in uses:"
        required: false
        type: string
        default: main
    secrets:
      BTC_USER:
        required: true
      BTC_PASSWORD:
        required: true
      BTC_OID:
        required: true
      BTC_BASE_URL:
        required: false

concurrency:
  group: crawl-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      BTC_USER: ${{ secrets.BTC_USER }}
      BTC_PASSWORD: ${{ secrets.BTC_PASSWORD }}
      BTC_OID: ${{ secrets.BTC_OID }}
      BTC_BASE_URL: ${{ secrets.BTC_BASE_URL }}
    steps:
      # Keep credentials: this job pushes its result to the caller repository.
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout btc2premis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dla-marbach/btc2premis
          ref: ${{ inputs.ref }}
          path: btc2premis-src
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install btc2premis
        run: python -m pip install --upgrade pip && pip install ./btc2premis-src

      - name: Fetch current crawl config overview
        run: |
          btc2premis --list --format markdown > /tmp/README.md

      - name: Export changed crawl configs and rebuild collection documents
        run: |
          python btc2premis-src/.github/workflows/scripts/export_changed.py \
            --previous "${{ inputs.output-dir }}/README.md" \
            --current /tmp/README.md \
            --output-dir "${{ inputs.output-dir }}"

      - name: Update overview file
        run: cp /tmp/README.md "${{ inputs.output-dir }}/README.md"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- "${{ inputs.output-dir }}")" ]; then
            git add -A -- "${{ inputs.output-dir }}"
            git commit -m "Update crawl config exports ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
